name: Build Bestcord

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        uses: actions/checkout@v4

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Run pnpm/action-setup@v3
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Use Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm run build:web

      - name: Build
        run: pnpm run build

      - name: Generate plugin list
        run: pnpm run generate:plugin-list

      - name: Generate Equicord plugin list
        run: pnpm run generate:equicord-plugin-list

      - name: Collect files to be released
        run: |
          echo "Collecting files from build directories..."
          ls -la dist/ || echo "No dist directory found"
          ls -la dist/equibop/ || echo "No equibop directory found"
          ls -la dist/desktop.asar/ || echo "No desktop.asar directory found"
          ls -la dist/equibop.asar/ || echo "No equibop.asar directory found"

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install gh -y

      - name: Create or Update Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Créer la release "latest" si elle n'existe pas
          if ! gh release view latest &>/dev/null; then
            echo "Creating new release 'latest'..."
            gh release create latest \
              --title "Latest Release" \
              --notes "Release automatique de la dernière version de Bashcord - $(date)" \
              --latest
          else
            echo "Release 'latest' already exists"
          fi

      - name: Upload Plugins JSON to Equibored repo
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading plugins JSON files..."
          # Upload plugin lists if they exist
          if [ -f "plugins.json" ]; then
            gh release upload latest --clobber plugins.json
          fi
          if [ -f "equicordplugins.json" ]; then
            gh release upload latest --clobber equicordplugins.json
          fi

      - name: Upload assets to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading build assets to release..."

          # Upload files from dist/equibop/
          if [ -d "dist/equibop" ]; then
            echo "Uploading files from dist/equibop/..."
            for FILE in dist/equibop/*; do
              if [ -f "$FILE" ]; then
                echo "Uploading: $FILE"
                gh release upload latest --clobber "$FILE"
              fi
            done
          fi

          # Upload files from dist/desktop.asar/
          if [ -d "dist/desktop.asar" ]; then
            echo "Uploading files from dist/desktop.asar/..."
            for FILE in dist/desktop.asar/*; do
              if [ -f "$FILE" ]; then
                echo "Uploading: $FILE"
                gh release upload latest --clobber "$FILE"
              fi
            done
          fi

          # Upload files from dist/equibop.asar/
          if [ -d "dist/equibop.asar" ]; then
            echo "Uploading files from dist/equibop.asar/..."
            for FILE in dist/equibop.asar/*; do
              if [ -f "$FILE" ]; then
                echo "Uploading: $FILE"
                gh release upload latest --clobber "$FILE"
              fi
            done
          fi

          echo "Upload completed!"

      - name: Post Use Node.js 20
        if: always()
        run: echo "Node.js setup completed"

      - name: Post Run pnpm/action-setup@v3
        if: always()
        run: echo "pnpm setup completed"

      - name: Post Run actions/checkout@v4
        if: always()
        run: echo "Checkout completed"

      - name: Complete job
        if: always()
        run: |
          echo "Build and release process completed!"
          echo "Check the release at: https://github.com/${{ github.repository }}/releases/tag/latest"
