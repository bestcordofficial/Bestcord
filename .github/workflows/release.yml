name: Upload Release Assets

on:
  push:
    branches:
      - main

jobs:
  upload-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install gh -y

      - name: Authenticate GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Create release if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest &>/dev/null; then
            gh release create latest --title "Latest Release" --notes "Release automatique de tous les fichiers nécessaires" --latest
          fi

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for DIR in dist/equibop dist/desktop.asar dist/equibop.asar; do
            if [ -d "$DIR" ]; then
              for FILE in "$DIR"/*; do
                if [ -f "$FILE" ]; then
                  gh release upload latest --clobber "$FILE"
                fi
              done
            fi
          done
